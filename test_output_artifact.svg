<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 400" width="100%" height="100%" style="background-color: #eff6ff;">
      
    <defs>
      <style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }</style>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#bfdbfe" />
      </marker>
    </defs>
  
      <text x="850" y="40" fill="#1e3a8a" font-size="24px" font-weight="bold" text-anchor="middle">Professional Document Creation and Submission Process</text>
      <g class="edges">
        
        <path d="M 210 225 C 230 225, 230 225, 250 225" 
              fill="none" stroke="#bfdbfe" stroke-width="2" marker-end="url(#arrowhead)"/>
      
          <rect x="210" y="215" width="40" height="20" fill="#eff6ff" />
          <text x="230" y="225" fill="#1e3a8a" font-size="10px" text-anchor="middle" dominant-baseline="central">proceeds to</text>
        
        <path d="M 410 225 C 430 225, 430 225, 450 225" 
              fill="none" stroke="#bfdbfe" stroke-width="2" marker-end="url(#arrowhead)"/>
      
          <rect x="410" y="215" width="40" height="20" fill="#eff6ff" />
          <text x="430" y="225" fill="#1e3a8a" font-size="10px" text-anchor="middle" dominant-baseline="central">leads to</text>
        
        <path d="M 610 225 C 630 225, 630 225, 650 225" 
              fill="none" stroke="#bfdbfe" stroke-width="2" marker-end="url(#arrowhead)"/>
      
          <rect x="610" y="215" width="40" height="20" fill="#eff6ff" />
          <text x="630" y="225" fill="#1e3a8a" font-size="10px" text-anchor="middle" dominant-baseline="central">enhance with</text>
        
        <path d="M 810 225 C 830 225, 830 225, 850 225" 
              fill="none" stroke="#bfdbfe" stroke-width="2" marker-end="url(#arrowhead)"/>
      
          <rect x="810" y="215" width="40" height="20" fill="#eff6ff" />
          <text x="830" y="225" fill="#1e3a8a" font-size="10px" text-anchor="middle" dominant-baseline="central">style after</text>
        
        <path d="M 1010 225 C 1030 225, 1030 225, 1050 225" 
              fill="none" stroke="#bfdbfe" stroke-width="2" marker-end="url(#arrowhead)"/>
      
          <rect x="1010" y="215" width="40" height="20" fill="#eff6ff" />
          <text x="1030" y="225" fill="#1e3a8a" font-size="10px" text-anchor="middle" dominant-baseline="central">convert for</text>
        
        <path d="M 1210 225 C 1230 225, 1230 225, 1250 225" 
              fill="none" stroke="#bfdbfe" stroke-width="2" marker-end="url(#arrowhead)"/>
      
          <rect x="1210" y="215" width="40" height="20" fill="#eff6ff" />
          <text x="1230" y="225" fill="#1e3a8a" font-size="10px" text-anchor="middle" dominant-baseline="central">submit</text>
        
        <path d="M 1410 225 C 1430 225, 1430 175, 1450 175" 
              fill="none" stroke="#bfdbfe" stroke-width="2" marker-end="url(#arrowhead)"/>
      
          <rect x="1410" y="190" width="40" height="20" fill="#eff6ff" />
          <text x="1430" y="200" fill="#1e3a8a" font-size="10px" text-anchor="middle" dominant-baseline="central">if changes needed</text>
        
        <path d="M 1610 175 C 1430 175, 1430 225, 1250 225" 
              fill="none" stroke="#bfdbfe" stroke-width="2" marker-end="url(#arrowhead)"/>
      
          <rect x="1410" y="190" width="40" height="20" fill="#eff6ff" />
          <text x="1430" y="200" fill="#1e3a8a" font-size="10px" text-anchor="middle" dominant-baseline="central">re‑submit after modification</text>
        
        <path d="M 1410 225 C 1430 225, 1430 275, 1450 275" 
              fill="none" stroke="#bfdbfe" stroke-width="2" marker-end="url(#arrowhead)"/>
      
          <rect x="1410" y="240" width="40" height="20" fill="#eff6ff" />
          <text x="1430" y="250" fill="#1e3a8a" font-size="10px" text-anchor="middle" dominant-baseline="central">final step</text>
        
      </g>
      <g class="nodes">
        
        <g transform="translate(50, 200)">
          <rect width="160" height="50" rx="6" fill="#1e40af" stroke="#bfdbfe" stroke-width="1" />
          <text x="80" y="25" fill="#eff6ff" font-size="14px" font-weight="bold" text-anchor="middle" dominant-baseline="central">Create Account</text>
        </g>
      
        <g transform="translate(250, 200)">
          <rect width="160" height="50" rx="6" fill="#1e40af" stroke="#bfdbfe" stroke-width="1" />
          <text x="80" y="25" fill="#eff6ff" font-size="14px" font-weight="bold" text-anchor="middle" dominant-baseline="central">Complete Application Form</text>
        </g>
      
        <g transform="translate(450, 200)">
          <rect width="160" height="50" rx="6" fill="#1e40af" stroke="#bfdbfe" stroke-width="1" />
          <text x="80" y="25" fill="#eff6ff" font-size="14px" font-weight="bold" text-anchor="middle" dominant-baseline="central">Design Document</text>
        </g>
      
        <g transform="translate(650, 200)">
          <rect width="160" height="50" rx="6" fill="#1e40af" stroke="#bfdbfe" stroke-width="1" />
          <text x="80" y="25" fill="#eff6ff" font-size="14px" font-weight="bold" text-anchor="middle" dominant-baseline="central">Insert Media</text>
        </g>
      
        <g transform="translate(850, 200)">
          <rect width="160" height="50" rx="6" fill="#1e40af" stroke="#bfdbfe" stroke-width="1" />
          <text x="80" y="25" fill="#eff6ff" font-size="14px" font-weight="bold" text-anchor="middle" dominant-baseline="central">Apply Theme &amp; Styles</text>
        </g>
      
        <g transform="translate(1050, 200)">
          <rect width="160" height="50" rx="6" fill="#1e40af" stroke="#bfdbfe" stroke-width="1" />
          <text x="80" y="25" fill="#eff6ff" font-size="14px" font-weight="bold" text-anchor="middle" dominant-baseline="central">Convert File Format</text>
        </g>
      
        <g transform="translate(1250, 200)">
          <rect width="160" height="50" rx="6" fill="#1e40af" stroke="#bfdbfe" stroke-width="1" />
          <text x="80" y="25" fill="#eff6ff" font-size="14px" font-weight="bold" text-anchor="middle" dominant-baseline="central">Submit Online Application</text>
        </g>
      
        <g transform="translate(1450, 150)">
          <rect width="160" height="50" rx="6" fill="#1e40af" stroke="#bfdbfe" stroke-width="1" />
          <text x="80" y="25" fill="#eff6ff" font-size="14px" font-weight="bold" text-anchor="middle" dominant-baseline="central">Modify Application (Optional)</text>
        </g>
      
        <g transform="translate(1450, 250)">
          <rect width="160" height="50" rx="6" fill="#1e40af" stroke="#bfdbfe" stroke-width="1" />
          <text x="80" y="25" fill="#eff6ff" font-size="14px" font-weight="bold" text-anchor="middle" dominant-baseline="central">Archive / Distribute</text>
        </g>
      
      </g>
    </svg>
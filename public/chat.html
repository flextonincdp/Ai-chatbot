<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knowledge Studio — Chat</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    /* ============================================
       CHAT-FIRST PROFESSIONAL LAYOUT
       ============================================ */
    .chat-container {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 72px);
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Scrolling message history */
    .chat-history {
      flex: 1;
      overflow-y: auto;
      padding: 28px 16px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      scroll-behavior: smooth;
    }
    .chat-history::-webkit-scrollbar { width: 5px; }
    .chat-history::-webkit-scrollbar-thumb { background: var(--line); border-radius: 10px; }

    /* Messages */
    .message { display: flex; flex-direction: column; width: 100%; max-width: 800px; margin: 0 auto; }
    .message.user { align-items: flex-end; }
    .message.assistant { align-items: flex-start; }

    .message.user .bubble-content {
      background: var(--ink);
      color: #fff;
      padding: 12px 18px;
      border-radius: 18px 18px 4px 18px;
      max-width: 75%;
      font-size: 14.5px;
      line-height: 1.55;
    }

    .message.assistant .bubble-content {
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 20px 24px;
      border-radius: 4px 18px 18px 18px;
      max-width: 100%;
      width: 100%;
      box-shadow: var(--shadow-sm);
      font-size: 15px;
      line-height: 1.7;
      color: var(--text-primary);
    }

    /* Answer content styling */
    .bubble-content.answer h3 {
      font-family: var(--serif);
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      margin: 20px 0 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--line-soft);
    }
    .bubble-content.answer h3:first-child { margin-top: 0; }
    .bubble-content.answer h4 {
      font-family: var(--sans);
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      margin: 16px 0 6px;
    }
    .bubble-content.answer p {
      margin: 0 0 10px;
    }
    .bubble-content.answer ul,
    .bubble-content.answer ol {
      padding-left: 20px;
      margin: 6px 0 12px;
    }
    .bubble-content.answer li {
      margin-bottom: 4px;
      line-height: 1.6;
    }
    .bubble-content.answer strong {
      font-weight: 600;
      color: var(--text-primary);
    }
    .bubble-content.answer em {
      font-style: italic;
      color: var(--text-secondary);
    }

    /* Sources section */
    .bubble-content .sources-section {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--line-soft);
    }
    .bubble-content .sources-title {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .source-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .source-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--text-secondary);
      background: var(--paper);
      border: 1px solid var(--line);
      padding: 4px 10px;
      border-radius: var(--radius-sm);
    }
    .source-downloads {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .source-download-btn {
      color: var(--brass);
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: var(--radius-sm);
      padding: 6px 10px;
      font-size: 12px;
      text-decoration: none;
    }
    .source-download-btn:hover {
      border-color: var(--brass-bright);
      background: var(--brass-subtle);
    }
    .source-icon { font-size: 12px; }

    /* Content sufficiency notes */
    .sufficiency-notes {
      margin-top: 14px;
      padding: 10px 14px;
      background: var(--info-bg);
      border: 1px solid var(--info-line);
      border-radius: var(--radius);
    }
    .sufficiency-note {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 13px;
      color: var(--info);
      line-height: 1.5;
      margin-bottom: 4px;
    }
    .sufficiency-note:last-child { margin-bottom: 0; }
    .note-icon { flex-shrink: 0; }

    /* Artifact cards */
    .artifacts-container {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .artifact-card {
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      background: var(--paper);
    }
    .artifact-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .artifact-icon { font-size: 18px; }
    .artifact-title {
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .artifact-filename {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-tertiary);
      margin-bottom: 10px;
    }
    .svg-preview {
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 12px;
      overflow: hidden;
      max-height: 400px;
      overflow-y: auto;
    }
    .svg-preview svg {
      width: 100%;
      height: auto;
    }
    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 18px;
      background: var(--ink);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: background .15s var(--ease);
    }
    .download-btn:hover { background: #000; }

    /* Error bubble */
    .error-bubble {
      background: var(--error-bg) !important;
      border-color: var(--error-line) !important;
      color: var(--error) !important;
    }

    /* Thinking animation */
    .thinking {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 20px !important;
    }
    .thinking-dots {
      display: flex;
      gap: 4px;
    }
    .thinking-dots span {
      display: block;
      width: 7px;
      height: 7px;
      background: var(--brass-bright);
      border-radius: 50%;
      animation: pulse 1.2s ease-in-out infinite;
    }
    .thinking-dots span:nth-child(2) { animation-delay: 0.15s; }
    .thinking-dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }
    .thinking-text {
      font-size: 13px;
      color: var(--text-muted);
      font-style: italic;
    }

    /* Welcome screen */
    .welcome-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 32px !important;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
    }
    .welcome-logo {
      width: 52px;
      height: 52px;
      background: var(--ink);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--sans);
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -1px;
      margin-bottom: 20px;
    }
    .welcome-title {
      font-family: var(--serif);
      font-size: 26px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }
    .welcome-desc {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.65;
      max-width: 460px;
    }

    /* Input area */
    .chat-input-container {
      padding: 16px 20px 20px;
      background: var(--panel);
      border-top: 1px solid var(--line);
    }
    .chat-input-row {
      display: flex;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      gap: 14px;
      align-items: center;
    }
    .chat-input-row input {
      flex: 1;
      flex-shrink: 0;
      min-width: 0;
      height: 60px;
      min-height: 60px;
      padding: 14px 24px;
      font-size: 17px;
      border-radius: 30px;
      border: 1px solid var(--line);
      background: var(--paper);
    }
    .chat-input-row input:focus {
      border-color: var(--brass-bright);
      outline: none;
    }
    .chat-input-row button.icon-btn {
      flex: 0 0 auto;
      min-width: 50px;
      height: 50px;
      padding: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--ink);
      color: white;
      transition: opacity 0.2s;
    }
    .chat-input-row button.icon-btn:hover {
      opacity: 0.8;
    }
    @media (max-width: 640px) {
      .chat-input-row {
        align-items: stretch;
        flex-direction: column;
      }
      .chat-input-row input,
      .chat-input-row button {
        width: 100%;
      }
    }
    .input-suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
      align-items: center;
    }
    .input-suggestions-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-right: 4px;
    }
    .input-suggestion-chip {
      font-size: 11.5px;
      color: var(--text-secondary);
      background: var(--paper);
      border: 1px solid var(--line);
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all .15s var(--ease);
    }
    .input-suggestion-chip:hover {
      background: var(--line-soft);
      color: var(--text-primary);
    }
    
    /* 3-Column Layout Overrides */
    .chat-container {
      max-width: 100% !important;
      border-right: 1px solid var(--line);
    }
    
    .session-item {
      position: relative;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 13px;
      color: var(--text-primary);
      transition: background 0.15s;
    }
    .session-item:hover {
      background: var(--paper);
    }
    .session-item.active {
      background: var(--paper);
      font-weight: 600;
      border: 1px solid var(--line);
    }
    .session-item-date {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .session-item-main {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .session-item-title {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .session-pin { margin-right: 4px; font-size: 11px; }
    .session-menu-btn {
      display: inline-flex;
      width: 25px;
      height: 25px;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--text-muted);
      font-size: 19px;
      line-height: 1;
      cursor: pointer;
      opacity: 0;
    }
    .session-item:hover .session-menu-btn,
    .session-item.active .session-menu-btn,
    .session-menu-btn:focus { opacity: 1; }
    .session-menu-btn:hover { background: var(--line-soft); color: var(--text-primary); }
    .session-actions {
      position: absolute;
      z-index: 5;
      top: 38px;
      right: 8px;
      min-width: 156px;
      padding: 5px;
      display: grid;
      gap: 2px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow);
    }
    .session-actions[hidden] { display: none; }
    .session-actions button {
      width: 100%;
      border: 0;
      border-radius: 5px;
      padding: 8px 9px;
      background: transparent;
      color: var(--text-primary);
      text-align: left;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    .session-actions button:hover { background: var(--line-soft); }
    .session-actions button.danger { color: var(--error); }
    
    .chart-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
    }
    .chart-card h4 {
      margin: 0 0 12px;
      font-size: 14px;
      color: var(--text-primary);
    }
  </style>
</head>
<body>

<div class="app" style="height: 100vh; overflow: hidden; display: flex; flex-direction: column; padding: 0; max-width: 100%;">
  <!-- Top Header -->
  <header class="top" style="flex-shrink: 0; margin-bottom: 0; border-bottom: 1px solid var(--line); padding-left: var(--space-lg); padding-right: var(--space-lg);">
    <div class="brandmark">
      <div class="mark">KS</div>
      <div class="name">Knowledge Studio</div>
    </div>
    <div class="who">
      <span class="role-pill">Employee</span>
      <a class="logout-link" id="logoutBtn">Log out</a>
    </div>
  </header>

  <div class="main-layout" style="display: flex; flex: 1; overflow: hidden;">
    <!-- Left Sidebar: Sessions -->
    <aside class="sidebar-left" style="width: 260px; border-right: 1px solid var(--line); display: flex; flex-direction: column; background: var(--panel); flex-shrink: 0;">
       <div style="padding: 16px;">
         <button class="primary" id="newSessionBtn" style="width: 100%; justify-content: center;">+ New Chat</button>
       </div>
       <div id="sessionList" style="flex: 1; overflow-y: auto; padding: 0 16px 16px; display: flex; flex-direction: column; gap: 8px;">
         <!-- Session items go here -->
       </div>
    </aside>

    <!-- Center: Chat Area -->
    <div class="chat-container" style="flex: 1; display: flex; flex-direction: column;">
      <div class="chat-history" id="chatHistory">
      <!-- Welcome Screen -->
        <div class="message assistant" id="welcomeMessage">
          <div class="bubble-content welcome-content">
            <div class="welcome-logo">KS</div>
            <div class="welcome-title">Knowledge Studio</div>
            <div class="welcome-desc">Your organization's knowledge, ready to explore.</div>
          </div>
        </div>
      </div>

      <!-- Input Area -->
      <div class="chat-input-container">
        <div class="chat-input-row">
          <input type="text" id="queryInput" placeholder="Ask anything about your organization's knowledge..." autocomplete="off">
          <button class="primary icon-btn" id="askBtn" aria-label="Send">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 19V5M5 12l7-7 7 7"/>
            </svg>
          </button>
        </div>
        <div id="askStatus" class="progress" style="margin: 6px auto 0; min-height: 14px; max-width: 800px;"></div>
      </div>
    </div>


  </div>
</div>

<script src="js/chat.js"></script>
</body>
</html>

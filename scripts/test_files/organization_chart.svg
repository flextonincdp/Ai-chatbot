<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <title>Organization Chart</title>
  <desc>Company organizational structure showing departments</desc>
  
  <!-- CEO Box -->
  <rect x="220" y="20" width="160" height="50" rx="8" fill="#2d3748" stroke="#8c641f" stroke-width="2"/>
  <text x="300" y="50" text-anchor="middle" fill="white" font-size="16" font-weight="bold">CEO</text>
  
  <!-- Lines -->
  <line x1="300" y1="70" x2="300" y2="120" stroke="#718096" stroke-width="2"/>
  <line x1="100" y1="120" x2="500" y2="120" stroke="#718096" stroke-width="2"/>
  
  <!-- Engineering -->
  <line x1="100" y1="120" x2="100" y2="150" stroke="#718096" stroke-width="2"/>
  <rect x="20" y="150" width="160" height="50" rx="8" fill="#f8f9fa" stroke="#e2e4e8" stroke-width="1"/>
  <text x="100" y="180" text-anchor="middle" fill="#2d3748" font-size="14">Engineering</text>
  
  <!-- Finance -->
  <line x1="300" y1="120" x2="300" y2="150" stroke="#718096" stroke-width="2"/>
  <rect x="220" y="150" width="160" height="50" rx="8" fill="#f8f9fa" stroke="#e2e4e8" stroke-width="1"/>
  <text x="300" y="180" text-anchor="middle" fill="#2d3748" font-size="14">Finance</text>
  
  <!-- Human Resources -->
  <line x1="500" y1="120" x2="500" y2="150" stroke="#718096" stroke-width="2"/>
  <rect x="420" y="150" width="160" height="50" rx="8" fill="#f8f9fa" stroke="#e2e4e8" stroke-width="1"/>
  <text x="500" y="180" text-anchor="middle" fill="#2d3748" font-size="14">Human Resources</text>

  <!-- Sub-departments under Engineering -->
  <line x1="100" y1="200" x2="100" y2="250" stroke="#718096" stroke-width="1"/>
  <line x1="50" y1="250" x2="150" y2="250" stroke="#718096" stroke-width="1"/>
  
  <rect x="10" y="260" width="80" height="40" rx="6" fill="#fff" stroke="#e2e4e8"/>
  <text x="50" y="285" text-anchor="middle" fill="#4a5568" font-size="11">
    <tspan x="50" dy="0">Frontend</tspan>
  </text>
  
  <rect x="110" y="260" width="80" height="40" rx="6" fill="#fff" stroke="#e2e4e8"/>
  <text x="150" y="285" text-anchor="middle" fill="#4a5568" font-size="11">
    <tspan x="150" dy="0">Backend</tspan>
  </text>
  
  <!-- Sub-departments under Finance -->
  <rect x="230" y="260" width="140" height="40" rx="6" fill="#fff" stroke="#e2e4e8"/>
  <text x="300" y="285" text-anchor="middle" fill="#4a5568" font-size="11">Accounting</text>
  
  <!-- Sub-departments under HR -->
  <rect x="430" y="260" width="140" height="40" rx="6" fill="#fff" stroke="#e2e4e8"/>
  <text x="500" y="285" text-anchor="middle" fill="#4a5568" font-size="11">Recruitment</text>
</svg>
